name: Release

on:
  push:
    branches:
      - master
      - beta
      - alpha

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # --- CALCULAR VERSÃO ---
  calculate-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      new_release_published: ${{ steps.semantic_version.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_version.outputs.new_release_version }}
      new_release_notes: ${{ steps.semantic_version.outputs.new_release_notes }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular Próxima Versão (Semantic Release)
        id: semantic_version
        uses: cycjimmy/semantic-release-action@v4
        with:
          branches: |
            [
              'master',
              { name: 'beta', prerelease: true },
              { name: 'alpha', prerelease: true }
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- CRIAR RELEASE VAZIA ---
  create-release:
    needs: calculate-version
    if: needs.calculate-version.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.calculate-version.outputs.new_release_version }}
          name: Release v${{ needs.calculate-version.outputs.new_release_version }}
          body: ${{ needs.calculate-version.outputs.new_release_notes }}
          prerelease: ${{ github.ref_name == 'beta' || github.ref_name == 'alpha' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- BUILD E UPLOAD DIRETO NA RELEASE ---
  build:
    needs: [calculate-version, create-release]
    if: needs.calculate-version.outputs.new_release_published == 'true'
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ needs.calculate-version.outputs.new_release_version }}
    secrets: inherit
